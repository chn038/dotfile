[env]
"GTK_IM_MODULE" = "fcitx"
"QT_IM_MODULE" = "fcitx"
"QT_IM_MODULES" = "wayland;fcitx"
"SQL_IM_MODULE" = "fcitx"
"XMODIFIERS" = "@im=fcitx"
"GLFW_IM_MODULE" = "ibus"
"QT_QPA_PLATFORMTHEME" = "qt6ct"

[global]

source= ["./noctalia.conf", "./monitors.conf"]
exec_once = ["noctalia", "fcitx5 -d", "kdeconnectd", "nm-applet", "blueman-applet", "rog-control-center", "kdeconnect-indicator"]
# More option see https://github.com/DreamMaoMao/mango/wiki/
# Window effect
blur = 0
blur_layer = 0
blur_optimized = 1
blur_params_num_passes = 2
blur_params_radius = 5
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2
shadows = 1
layer_shadows = 1
shadow_only_floating = 1
shadows_size = 4
shadows_blur = 15
shadows_position_x = 0
shadows_position_y = 0
shadows_color = 0x000000ff
border_radius = 6
no_radius_when_single = 0
focused_opacity = 1.0
unfocused_opacity = 1.0
dim_enable = 0
dim_focused_color = 0x00000000
dim_unfocused_color = 0x00000055

# Animation Configuration(support type:zoom,slide)
# tag_animation_direction: 1-horizontal,0-vertical
animations = 0
layer_animations = 0
animation_type_open = "slide"
animation_type_close = "slide"
animation_fade_in = 1
animation_fade_out = 1
tag_animation_direction = 1
zoom_initial_ratio = 0.4
zoom_end_ratio = 0.8
fade_in_begin_opacity = 0.5
fade_out_begin_opacity = 0.8
animation_duration_move = 500
animation_duration_open = 400
animation_duration_tag = 350
animation_duration_close = 800
animation_duration_focus = 0
animation_curve_open = [0.46, 1.0, 0.29, 1]
animation_curve_move = [0.46, 1.0, 0.29, 1]
animation_curve_tag = [0.46, 1.0, 0.29, 1]
animation_curve_close = [0.08, 0.92, 0, 1]
animation_curve_focus = [0.46, 1.0, 0.29, 1]
animation_curve_opacity_fade_out = [0.5, 0.5, 0.5, 0.5]
animation_curve_opacity_fade_in = [0.46, 1.0, 0.29, 1]

# Scroller Layout Setting
scroller_structs = 20
scroller_default_proportion = 0.8
scroller_focus_center = 0
scroller_prefer_center = 0
edge_scroller_pointer_focus = 1
edge_scroller_focus_allow_speed = 0.0
scroller_default_proportion_single = 1.0
scroller_proportion_preset = [0.5, 0.8, 1.0]

# Master-Stack Layout Setting
new_is_master = 0
default_master_factor = 0.50
default_master_count = 1
tag_num = 9
smart_gaps = 0

# Dwindle Layout Setting
dwindle_smart_split = 0
dwindle_drop_simple_split = 1
dwindle_manual_split = 0
dwindle_horizontal_split = 1
dwindle_vertical_split = 1
dwindle_preserve_split = 0

# Monocle Layout Setting
monocle_tab_mode = 1
monocle_no_border = 0
monocle_no_gap = 0
monocle_no_radius = 0

# Deck Layout Setting
deck_tab_mode = 1

# Overview Setting
hotarea_size = 10
enable_hotarea = 0
hotarea_disable_on_fullscreen = 1
overview_gap_inner = 5
overview_gap_outer = 30
overcircle_center_ratio = 0.5
title_message_bar_height = 52
title_message_bar_gap = 20

# Misc
no_border_when_single = 0
axis_bind_apply_timeout = 100
focus_on_activate = 1
idle_inhibit_ignore_visible = 0
idle_inhibit_when_fullscreen = 0
sloppy_focus = 1
warp_cursor = 1
focus_cross_monitor = 0
focus_direction_only_zone_overlap = 1
focus_cross_tag = 0
enable_floating_snap = 0
snap_distance = 30
float_full_to_top = 0
cursor_size = 24
drag_tile_to_tile = 1
drag_tile_small = 1

# keyboard
repeat_rate = 25
repeat_delay = 600
numlock_on = 0
xkb_rules_layout = "us"

# Trackpad
# need relogin to make it apply
disable_trackpad = 0
tap_to_click = 1
tap_and_drag = 1
drag_lock = 1
trackpad_natural_scrolling = 1
trackpad_disable_while_typing = 1
trackpad_left_handed = 0
trackpad_middle_button_emulation = 0
swipe_min_threshold = 1

# mouse
# need relogin to make it apply
mouse_natural_scrolling = 0

# Appearance
gap_inner_horizontal = 5
gap_inner_vertical = 5
gap_outer_horizontal = 10
gap_outer_vertical = 10
scratchpad_width_ratio = 0.8
scratchpad_height_ratio = 0.9
border_px = 4
root_color = 0x201b14ff
border_color = 0x444444ff
drop_color = 0x8FBA7C55
split_color = 0xEB441EFF
focus_color = 0xc9b890ff
maximized_screen_color = 0x89aa61ff
urgent_color = 0xad401fff
scratchpad_color = 0x516c93ff
global_color = 0xb153a7ff
overlay_color = 0x14a57cff

[bind.default]
# Key Bindings
# key name refer to `xev` or `wev` command output,
# mod keys name: super,ctrl,alt,shift,none
# reload config
"SUPER+r" = "reload_config"
"SUPER+p" = "spawn,noctalia msg screenshot-region"
"Print" = "spawn,noctalia msg screenshot-region"

# menu and terminal
"SUPER+d" = "spawn,noctalia msg panel-toggle launcher"
"SUPER+s" = "spawn,noctalia msg panel-toggle control-center"
"SUPER+comma" = "spawn,noctalia msg settings-toggle"
"SUPER+Return" = "spawn,wezterm"

# media keys
"none+XF86AudioRaiseVolume" = "spawn,noctalia msg volume-up"
"none+XF86AudioLowerVolume" = "spawn,noctalia msg volume-down"
"none+XF86AudioMute" = "spawn,noctalia msg volume-mute"
"none+XF86AudioMicMute" = "spawn,noctalia msg mic-mute"
"SUPER+CTRL+z" = "spawn,noctalia msg mic-mute"
"none+XF86MonBrightnessUp" = "spawn,noctalia msg brightness-up"
"none+XF86MonBrightnessDown" = "spawn,noctalia msg brightness-down"

# exit
"SUPER+m" = "quit"
"SUPER+c" = "killclient,"

# switch window focus
"SUPER+Tab" = "focusstack,next"
"SUPER+h" = "focusdir,left"
"SUPER+l" = "focusdir,right"
"SUPER+k" = "focusdir,up"
"SUPER+j" = "focusdir,down"

# move window
"SUPER+SHIFT+k" = "move_client,up"
"SUPER+SHIFT+j" = "move_client,down"
"SUPER+SHIFT+h" = "move_client,left"
"SUPER+SHIFT+l" = "move_client,right"

# switch window status
"SUPER+g" = "toggleglobal,"
"SUPER+SHIFT+Tab" = "togglejump,"
"SUPER+t" = "togglefloating,"
"SUPER+f" = "togglemaximizescreen,"
"SUPER+SHIFT+f" = "togglefullscreen,"
"SUPER+CTRL+f" = "togglefakefullscreen,"
"SUPER+i" = "minimized,"
"SUPER+o" = "toggleoverlay,"
"SUPER+SHIFT+I" = "restore_minimized"
"SUPER+SHIFT+z" = "toggle_scratchpad"

# scroller layout
"super+e" = "set_proportion,1.0"
"super+x" = "switch_proportion_preset,"
"alt+super+ctrl+Left" = "scroller_stack,left"
"alt+super+ctrl+Right" = "scroller_stack,right"
"alt+super+ctrl+Up" = "scroller_stack,up"
"alt+super+ctrl+Down" = "scroller_stack,down"

#dwindle layout(manual split mode)
"alt+super+Return" = "dwindle_toggle_split_direction"

# switch layout
"SUPER+n" = "switch_layout"

# tag switch
"SUPER+Left" = "viewtoleft,0"
"CTRL+Left" = "viewtoleft_have_client,0"
"SUPER+Right" = "viewtoright,0"
"CTRL+Right" = "viewtoright_have_client,0"
"CTRL+SUPER+SHIFT+Left" = "tagtoleft,0"
"CTRL+SUPER+SHIFT+Right" = "tagtoright,0"
"SUPER+1" = "view,1,0"
"SUPER+2" = "view,2,0"
"SUPER+3" = "view,3,0"
"SUPER+4" = "view,4,0"
"SUPER+5" = "view,5,0"
"SUPER+6" = "view,6,0"
"SUPER+7" = "view,7,0"
"SUPER+8" = "view,8,0"
"SUPER+9" = "view,9,0"
"SUPER+CTRL+1" = "toggleview,1"
"SUPER+CTRL+2" = "toggleview,2"
"SUPER+CTRL+3" = "toggleview,3"
"SUPER+CTRL+4" = "toggleview,4"
"SUPER+CTRL+5" = "toggleview,5"
"SUPER+CTRL+6" = "toggleview,6"
"SUPER+CTRL+7" = "toggleview,7"
"SUPER+CTRL+8" = "toggleview,8"
"SUPER+CTRL+9" = "toggleview,9"
"SUPER+SHIFT+CTRL+1" = "toggletag,1"
"SUPER+SHIFT+CTRL+2" = "toggletag,2"
"SUPER+SHIFT+CTRL+3" = "toggletag,3"
"SUPER+SHIFT+CTRL+4" = "toggletag,4"
"SUPER+SHIFT+CTRL+5" = "toggletag,5"
"SUPER+SHIFT+CTRL+6" = "toggletag,6"
"SUPER+SHIFT+CTRL+7" = "toggletag,7"
"SUPER+SHIFT+CTRL+8" = "toggletag,8"
"SUPER+SHIFT+CTRL+9" = "toggletag,9"

# tag: move client to the tag and focus it
# tagsilent: move client to the tag and not focus it
# bind=Alt,1,tagsilent,1
"SUPER+SHIFT+1" = "tag,1,0"
"SUPER+SHIFT+2" = "tag,2,0"
"SUPER+SHIFT+3" = "tag,3,0"
"SUPER+SHIFT+4" = "tag,4,0"
"SUPER+SHIFT+5" = "tag,5,0"
"SUPER+SHIFT+6" = "tag,6,0"
"SUPER+SHIFT+7" = "tag,7,0"
"SUPER+SHIFT+8" = "tag,8,0"
"SUPER+SHIFT+9" = "tag,9,0"

# monitor switch
"SUPER+shift+Left" = "focusmon,left"
"SUPER+shift+Right" = "focusmon,right"
"SUPER+shift+Alt+Left" = "tagmon,left"
"SUPER+shift+Alt+Right" = "tagmon,right"

# gaps
"ALT+SUPER+X" = "incgaps,1"
"ALT+SUPER+Z" = "incgaps,-1"
"ALT+SUPER+R" = "togglegaps"

# movewin
"CTRL+SUPER+Up" = "movewin,+0,-50"
"CTRL+SUPER+Down" = "movewin,+0,+50"
"CTRL+SUPER+Left" = "movewin,-50,+0"
"CTRL+SUPER+Right" = "movewin,+50,+0"

# resizewin
"SUPER+ALT+Up" = "resizewin,+0,-50"
"SUPER+ALT+Down" = "resizewin,+0,+50"
"SUPER+ALT+Left" = "resizewin,-50,+0"
"SUPER+ALT+Right" = "resizewin,+50,+0"

[mousebind.default]

# Mouse Button Bindings
# btn_left and btn_right can't bind none mod key
"SUPER+btn_left" = "moveresize,curmove"
"btn_middle" = "togglemaximizescreen,0"
"SUPER+btn_right" = "moveresize,curresize"

[axisbind.default]

# Axis Bindings
"SUPER+UP" = "viewtoleft_have_client"
"SUPER+DOWN" = "viewtoright_have_client"

[gesturebind.default]

# Gesture Bindings
"none+left+3" = "focusdir,left"
"none+right+3" = "focusdir,right"
"none+up+3" = "focusdir,up"
"none+down+3" = "focusdir,down"
"none+right+4" = "viewprev_have_client"
"none+left+4" = "viewnext_have_client"
"none+up+4" = "enteroverview"
"none+down+4" = "leaveoverview"

# layout support:
# tile,scroller,grid,deck,monocle,center_tile,vertical_tile,vertical_scroller

[[rule.tag_rule]]
id = 1
layout_name = "tile"

[[rule.tag_rule]]
id = 2
layout_name = "tile"

[[rule.tag_rule]]
id = 3
layout_name = "tile"

[[rule.tag_rule]]
id = 4
layout_name = "tile"

[[rule.tag_rule]]
id = 5
layout_name = "tile"

[[rule.tag_rule]]
id = 6
layout_name = "tile"

[[rule.tag_rule]]
id = 7
layout_name = "tile"

[[rule.tag_rule]]
id = 8
layout_name = "tile"

[[rule.tag_rule]]
id = 9
layout_name = "tile"

# layer rule

[[rule.layer_rule]]
animation_type_open = "zoom"
layer_name = "rofi"

[[rule.layer_rule]]
animation_type_close = "zoom"
layer_name = "rofi"
