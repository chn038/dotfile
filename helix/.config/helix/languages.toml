[[language]]
name = "cpp"
auto-format = false
indent = {	tab-width = 4,	unit = "\t"}

[[language]]
name = "rust"
auto-format = false
indent = {	tab-width = 4,	unit = "\t"}

[[language]]
name = "python"
formatter = { command = "ruff", args = ["format", "--line-length", "88", "-"] }
auto-format = true
language-servers = ["ruff", "ty"]

[language-server.ruff]
command = "ruff"
args = ["server"]

[language-server.ty]
command = "ty"
args = ["server"]
